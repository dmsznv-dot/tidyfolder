name: Native macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Swift toolchain
        run: |
          swift --version
          swift --version | python3 -c 'import re,sys; v=re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()); assert v and tuple(map(int,v.groups())) >= (6,2), "Swift 6.2+ required"'
      - name: Core and crash recovery tests
        run: ./scripts/swift.sh test --no-parallel
      - name: Universal app
        run: ./scripts/build-app.sh universal
      - name: Validate damaged artifacts
        env:
          EXPECTED_ARCH: universal
        run: python3 scripts/test-release.py
      - name: Preview distribution
        run: ./scripts/package-release.sh 0.1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TidyFolder-preview-macOS
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
