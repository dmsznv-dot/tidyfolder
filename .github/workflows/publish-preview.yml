name: Publish reviewed 0.1.2 preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-preview.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-preview-0.1.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Confirm reviewed source and successful CI
        run: |
          gh api repos/dmsznv-dot/tidyfolder/actions/runs/38700981053 > "$RUNNER_TEMP/reviewed-run.json"
          python3 - "$RUNNER_TEMP/reviewed-run.json" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1]))
          assert run['head_sha']=='b86046cc1f59e197176ee68d97d12b429c8cf775'
          assert run['status']=='completed' and run['conclusion']=='success'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: TidyFolder-preview-macOS
          run-id: 38700981053
          github-token: ${{ github.token }}
          path: preview
      - name: Verify the exact archives reviewed after downloading
        working-directory: preview
        run: |
          shasum -a 256 -c SHA256SUMS
          printf '%s\n' \
            '300893dd2ad58a918bd5d35e2712cfcb0910c3fe80ae16a6595075f98e01de0f  TidyFolder-0.1.2-macOS.zip' \
            'c331a4b43403fcb102dce84f22ed9ecae35c2353e9d5ca0e69587ee343d9dbf0  TidyFolder-0.1.2-macOS.dmg' | shasum -a 256 -c -
          ditto -x -k TidyFolder-0.1.2-macOS.zip extracted
          EXPECTED_ARCH=universal ../scripts/verify-release.sh extracted/TidyFolder.app
      - name: Publish reviewed preview
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo 'Release already exists; leaving existing attachments unchanged.'
            exit 0
          fi
          gh release create v0.1.2 --target b86046cc1f59e197176ee68d97d12b429c8cf775 --prerelease --title 'TidyFolder 0.1.2 preview' --notes-file docs/preview-release-notes.md preview/TidyFolder-0.1.2-macOS.zip preview/TidyFolder-0.1.2-macOS.dmg preview/SHA256SUMS
