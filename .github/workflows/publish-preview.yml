name: Publish reviewed 0.1.1 preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-preview.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-preview-0.1.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Confirm reviewed source and successful CI
        run: |
          gh api repos/dmsznv-dot/tidyfolder/actions/runs/38635030942 > "$RUNNER_TEMP/reviewed-run.json"
          python3 - "$RUNNER_TEMP/reviewed-run.json" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1]))
          assert run['head_sha']=='93b8a3e12184671bbf34a514c94f5ceb2520ac6f'
          assert run['status']=='completed' and run['conclusion']=='success'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: TidyFolder-preview-macOS
          run-id: 38635030942
          github-token: ${{ github.token }}
          path: preview
      - name: Verify the exact archives reviewed after downloading
        working-directory: preview
        run: |
          shasum -a 256 -c SHA256SUMS
          printf '%s\n' \
            '5e27056c469f7cdaab981746155b9ae7c0802b014416c8fe8b755e74495241f5  TidyFolder-0.1.1-macOS.zip' \
            '1c8d30aa7505b7d6caf11bfc63a10b03e286576187519fc672e9623d19403508  TidyFolder-0.1.1-macOS.dmg' | shasum -a 256 -c -
          ditto -x -k TidyFolder-0.1.1-macOS.zip extracted
          EXPECTED_ARCH=universal ../scripts/verify-release.sh extracted/TidyFolder.app
      - name: Publish reviewed preview
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo 'Release already exists; leaving existing attachments unchanged.'
            exit 0
          fi
          gh release create v0.1.1 --target 93b8a3e12184671bbf34a514c94f5ceb2520ac6f --prerelease --title 'TidyFolder 0.1.1 preview' --notes-file docs/preview-release-notes.md preview/TidyFolder-0.1.1-macOS.zip preview/TidyFolder-0.1.1-macOS.dmg preview/SHA256SUMS
